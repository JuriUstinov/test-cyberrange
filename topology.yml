name: reduced-sandbox
hosts:
  # Host 'server' wurde auskommentiert, um Ressourcen zu sparen
  # - name: server
  #   base_box:
  #     image: debian-12-x86_64
  #     mgmt_user: debian
  #   flavor: standard.small
  #   hidden: True
  #   volumes:
  #     - size: 16
  #     - size: 2
  #     - size: 9

  - name: home
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    flavor: standard.tiny

routers:
  # Router 'server-router' wurde auskommentiert
  # - name: server-router
  #   base_box:
  #     image: debian-12-x86_64
  #     mgmt_user: debian
  #   flavor: standard.small

  - name: home-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.tiny

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  # Server-Netzwerk ebenfalls deaktiviert
  # - name: server-switch
  #   cidr: 10.10.20.0/24
  #   accessible_by_user: False

  - name: home-switch
    cidr: 10.10.30.0/24

net_mappings:
  # - host: server
  #   network: server-switch
  #   ip: 10.10.20.5

  - host: home
    network: home-switch
    ip: 10.10.30.5

router_mappings:
  # - router: server-router
  #   network: server-switch
  #   ip: 10.10.20.1

  - router: home-router
    network: home-switch
    ip: 10.10.30.1

  # Verbindung zum WAN für Management
  - router: home-router
    network: internet-connection

groups:
  - name: custom-group
    nodes:
      - home
      - home-router
