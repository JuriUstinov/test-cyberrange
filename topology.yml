name: small-sandbox
hosts:
  - name: server
    base_box:
      image: debian-12-x86_64  # Korrekt laut Liste
      mgmt_user: debian
    flavor: standard.small
  - name: home
    base_box:
      image: mint              # Geändert von Windows auf Mint
      mgmt_user: mint          # Standard-User für Mint (meistens 'mint' oder 'ubuntu')
      # mgmt_protocol: winrm   # Entfernt, da Linux wieder SSH nutzt
    flavor: standard.small

routers:
  - name: server-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small
  - name: home-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: server-switch
    cidr: 10.10.20.0/24
  - name: home-switch
    cidr: 10.10.30.0/24

net_mappings:
    - host: server
      network: server-switch
      ip: 10.10.20.5
    - host: home
      network: home-switch
      ip: 10.10.30.5

router_mappings:
    - router: server-router
      network: server-switch
      ip: 10.10.20.1
    - router: home-router
      network: home-switch
      ip: 10.10.30.1
    # WICHTIG: Die Router müssen auch ans WAN gebunden werden!
    - router: server-router
      network: internet-connection
      ip: 100.100.100.1
    - router: home-router
      network: internet-connection
      ip: 100.100.100.2